<mat-toolbar class="navbar">
  <div class="logo">
    <mat-icon>toys</mat-icon>
    <span>KVA 2026</span>
  </div>

  <span class="specer"></span>

  <div class="nav-links">
    <a routerLink="/" matButton> <mat-icon fontIcon="home"></mat-icon>Home</a>

    <a routerLink="/about" matButton>
      <mat-icon fontIcon="info"></mat-icon>O nama</a
    >

    <a routerLink="/cart" matButton>
      <mat-icon fontIcon="shopping_cart"></mat-icon>Korpa</a
    >

    @if (authService.getActiveUser()) {
    <a routerLink="/user" matButton>
      <mat-icon fontIcon="account_box"></mat-icon>Account</a
    >
    <button matButton (click)="doLogout()">
      <mat-icon fontIcon="logout"></mat-icon>Logout
    </button>
    } @else {
    <a routerLink="/login" matButton>
      <mat-icon fontIcon="login"></mat-icon>Login</a
    >
    }
  </div>
</mat-toolbar>

<div class="wrapper">
  <router-outlet />
</div>
