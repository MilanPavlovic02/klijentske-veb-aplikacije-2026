<ul>
    @for (t of toys(); track $index) {
        <li>
            <h3>{{t.name}}</h3>
            <ul>
                <li>ID: <strong> {{t.toyId}}</strong></li>
                <li>Description: <strong> {{t.description}}</strong></li>
                <li>Price: <strong> {{t.price}}</strong></li>
            </ul>

        </li>
    }


</ul>
