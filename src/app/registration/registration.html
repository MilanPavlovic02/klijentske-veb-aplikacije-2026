<mat-card class="login-card">
  <mat-card-header>
    <h1>Registracija</h1>
  </mat-card-header>

  <mat-card-content>
    <div class="form-container">
      <div style="display: flex; gap: 10px">
        <mat-form-field class="full-width">
          <mat-label>Ime</mat-label>
          <input matInput [(ngModel)]="userData.firstName" />
        </mat-form-field>
        <mat-form-field class="full-width">
          <mat-label>Prezime</mat-label>
          <input matInput [(ngModel)]="userData.lastName" />
        </mat-form-field>
      </div>

      <mat-form-field class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="userData.email" />
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Telefon</mat-label>
        <input matInput [(ngModel)]="userData.phone" />
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Adresa</mat-label>
        <input matInput [(ngModel)]="userData.address" />
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Lozinka</mat-label>
        <input matInput type="password" [(ngModel)]="userData.password" />
      </mat-form-field>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button
      type="button"
      mat-raised-button
      color="primary"
      (click)="doRegister()"
    >
      <mat-icon fontIcon="person_add"></mat-icon> Kreiraj nalog
    </button>
  </mat-card-actions>

  <div style="padding: 10px; text-align: center">
    <span>Već imate nalog? </span>
    <a routerLink="/login" matButton color="accent">Prijavite se</a>
  </div>
</mat-card>
